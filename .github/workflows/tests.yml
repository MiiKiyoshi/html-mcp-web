name: tests

# The tests read neither the README nor the docs, so a change to those alone runs none.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
    paths-ignore: ["README.md", "docs/**"]

jobs:
  tests:
    runs-on: ubuntu-24.04
    # A test that waits for ever fails after two minutes (pyproject.toml), so the job ends well
    # inside this.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python packages
        run: pip install -e ".[mcp,dev]"
      # The fonts the browser tests were written with, which every Chrome a test starts sets
      # the generic families in (tests/fonts.py).
      - name: Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-mono fonts-dejavu-core fonts-dejavu-mono
      # The runner's own Chrome, which the tests find as the package does. Without one every
      # browser test would be skipped and the job would pass, so this step fails instead.
      - name: Chrome
        run: python -m tests.html_chrome
      - name: Tests
        env:
          REVIEW_FAILURES: ${{ runner.temp }}/failures
        run: |
          # A browser test that a loaded runner fails once is run again by itself.
          python -m pytest -rfs --durations 15 || python -m pytest -rfs --last-failed --last-failed-no-failures none
      # What the page showed when a browser test failed, a failure that passed when run again
      # too: its screenshot, markup, fields and console.
      - name: Pages of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-linux-${{ matrix.python }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore

  # The page's users are on Windows and macOS too: every test runs there as well, the browser's
  # in the Chrome each runner has installed.
  other-systems:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # A system's tests run in parts, each on a runner of its own: a runner's few cores are
      # shared by a Chrome per worker.
      matrix:
        include:
          - {os: windows-latest, part: "1/3"}
          - {os: windows-latest, part: "2/3"}
          - {os: windows-latest, part: "3/3"}
          - {os: macos-latest, part: "1/2"}
          - {os: macos-latest, part: "2/2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages
        run: pip install -e ".[mcp,dev]"
      # The same fonts as on Linux, installed for the runner's user (tests/fonts.py).
      - name: Fonts
        run: python -m tests.fonts
      - name: Chrome
        run: python -m tests.html_chrome
      - name: Tests
        shell: bash
        env:
          REVIEW_FAILURES: ${{ runner.temp }}/failures
        run: |
          # The runner's own chromedriver can be older than its Chrome. Without it Selenium
          # fetches the one that fits.
          while command -v chromedriver >/dev/null; do rm -f "$(command -v chromedriver)" || break; done
          unset CHROMEWEBDRIVER
          python -m pytest -rfs --durations 15 --part ${{ matrix.part }} \
            || python -m pytest -rfs --last-failed --last-failed-no-failures none
      - name: Pages of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore

  # Mac users read the page in Safari, whose engine is not Chrome's: the review page's browser
  # tests run in it too, through its own driver, while the server checks and prints in Chrome.
  # It has no window without a screen and takes one session at a time, so its tests run one
  # after another.
  safari:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python packages
        run: pip install -e ".[mcp,dev]"
      - name: Fonts
        run: python -m tests.fonts
      - name: Safari's driver
        run: |
          sudo safaridriver --enable
          /usr/bin/safaridriver --version
          # A Mac whose screen goes to sleep during the tests fails them in Safari, so they run
          # under caffeinate. The log keeps the runner's own sleep settings.
          pmset -g | grep -i sleep || true
      - name: Browser tests in Safari
        env:
          REVIEW_BROWSER_KIND: safari
          REVIEW_FAILURES: ${{ runner.temp }}/failures
        run: |
          caffeinate -dimsu python -m pytest -n 0 -rfs --part ${{ matrix.part }} tests/test_browser.py \
            || caffeinate -dimsu python -m pytest -n 0 -rfs --last-failed --last-failed-no-failures none tests/test_browser.py
      - name: Pages of failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-safari-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failures
          if-no-files-found: ignore
