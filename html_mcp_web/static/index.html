<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>html-web</title>
  <link rel="stylesheet" href="/static/shared/look.css">
  <link rel="stylesheet" href="/static/shared/comment-panel.css">
  <link rel="stylesheet" href="/static/shared/help.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/shared/look-early.js" data-prefix="htmlMcp"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>html-web</h1>
      <div class="artifact-meta" aria-label="Current artifact">
        <span id="main-file" class="main-file">loading</span>
        <span id="artifact-status" class="artifact-status">connecting</span>
      </div>
      <nav class="view-tabs" aria-label="Workspace view">
        <button class="view-tab active" type="button" data-view="preview">Preview</button>
        <button class="view-tab" type="button" data-view="source">Source</button>
        <button class="view-tab" type="button" data-view="split">Split</button>
      </nav>
      <nav id="artifact-tabs" class="artifact-tabs" aria-label="Artifacts"></nav>
      <div class="topbar-actions">
        <button id="fullscreen-btn" type="button" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button>
        <!-- Settings: the page's look and the key that sends a comment. On a phone the ⋯ menu
             offers it instead. -->
        <button id="settings-btn" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <span class="more">
          <button id="more-btn" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          <div id="more-menu" class="more-menu" role="menu" hidden>
            <button id="download-pdf-btn" class="download-btn" type="button" role="menuitem" data-label="Export PDF" title="Export the artifact as a PDF">Export PDF</button>
            <button id="download-pptx-btn" class="download-btn" type="button" role="menuitem" data-label="Export PPTX" title="Export the deck as an editable pptx">Export PPTX</button>
            <button id="artifact-comment-btn" type="button" role="menuitem">Add a note on the whole artifact…</button>
            <button id="help-btn" type="button" role="menuitem">Help (?)</button>
            <button id="settings-menu-btn" type="button" role="menuitem">Settings…</button>
          </div>
        </span>
        <button id="sidebar-toggle-btn" type="button" title="Toggle comments (\)">⇥</button>
      </div>
    </header>

    <main class="layout view-preview">
      <div id="workspace">
        <div class="workspace-toolbar">
          <button id="thumbs-btn" type="button" title="Show or hide slide previews"
                  aria-label="Show or hide slide previews" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <rect x="1.5" y="1.5" width="4.5" height="3.2" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <rect x="1.5" y="6.4" width="4.5" height="3.2" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <rect x="1.5" y="11.3" width="4.5" height="3.2" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <rect x="7.8" y="1.5" width="6.7" height="13" rx=".8" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </button>
          <button id="area-btn" type="button" title="Draw a box on a page to comment on it"
                  aria-label="Draw a box on a page to comment on it" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
              <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6M8 12h8M12 8v8" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="zoom-reset-btn" class="zoom-reset hidden" type="button"
                  title="Back to the size the pane fits">Fit</button>
          <button id="scripts-btn" type="button" title="Show or hide speaker scripts" aria-label="Show or hide speaker scripts">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <path d="M2.5 1.5h8l3 3v10h-11z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M10.5 1.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M4.5 7.5h7M4.5 10h7M4.5 12.5h4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="search-btn" type="button" title="Find in the artifact (⌘F or Ctrl+F)"
                  aria-label="Find in the artifact" aria-controls="search-bar" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <circle cx="6.7" cy="6.7" r="4.7" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M10.2 10.2l4.3 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <section id="artifact-pane">
          <aside id="thumbs-pane" aria-label="Slide previews">
            <iframe id="thumbs-frame" title="Slide previews" tabindex="-1"></iframe>
          </aside>
          <iframe id="artifact-frame" class="artifact-frame active" title="Agent-generated HTML artifact" tabindex="-1"></iframe>
          <div id="search-bar" class="search-bar hidden" role="search">
            <input id="search-input" type="text" placeholder="Find in artifact" aria-label="Find in artifact"
                   autocomplete="off" spellcheck="false">
            <span id="search-count" class="search-count" aria-live="polite"></span>
            <button id="search-prev-btn" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)" disabled>↑</button>
            <button id="search-next-btn" type="button" aria-label="Next match" title="Next match (Enter)" disabled>↓</button>
            <button id="search-close-btn" type="button" aria-label="Close find" title="Close (Esc)">×</button>
          </div>
          <!-- What words selected on a page offer, in one box beside them: a comment on them, or
               their place in the source. -->
          <div id="selection-menu" class="selection-menu hidden" role="toolbar" aria-label="Selected words">
            <button id="selection-comment-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v.01M8 11v.01M16 11v.01"/><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3z"/></svg>Comment</button>
            <button id="selection-source-btn" type="button" title="Show these words in the source"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Source</button>
          </div>
          <div id="presentation-controls" class="presentation-controls" aria-label="Slide show controls">
            <button id="presentation-prev-btn" type="button" aria-label="Previous slide">←</button>
            <span id="presentation-page" aria-live="polite"></span>
            <button id="presentation-next-btn" type="button" aria-label="Next slide">→</button>
            <button id="presentation-exit-btn" type="button">Exit</button>
          </div>
        </section>

        <div id="split-grip" role="separator" tabindex="0" aria-label="Resize preview and source panes"
             aria-controls="artifact-pane source-pane" aria-orientation="vertical"
             aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" title="Drag to resize preview and source"></div>
        <section id="source-pane" aria-label="Source editor">
          <div class="source-toolbar">
            <span id="source-file" class="source-file">Source</span>
            <span id="source-status" class="source-status">Open Source to edit</span>
            <button id="source-font-smaller-btn" type="button" title="Smaller source text" aria-label="Smaller source text"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 12h6"/></svg></button>
            <button id="source-font-larger-btn" type="button" title="Larger source text" aria-label="Larger source text"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 12h6M18 9v6"/></svg></button>
            <button id="source-wrap-btn" type="button" aria-pressed="true" title="Wrap long lines" aria-label="Wrap long lines"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h15a3 3 0 1 1 0 6h-4M3 18h7"/><path d="m16 16-2 2 2 2"/></svg></button>
            <button id="source-vim-btn" type="button" aria-pressed="false" title="Vim keys (:w saves)" aria-label="Vim keys (:w saves)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="currentColor"><path d="M24 11.986h-.027l-4.318-4.318 4.303-4.414V1.461l-.649-.648h-8.198l-.66.605v1.045L12.015.027V0L12 .014 11.986 0v.027l-1.29 1.291-.538-.539H2.035l-.638.692v1.885l.616.616h.72v5.31L.027 11.987H0L.014 12 0 12.014h.027l2.706 2.706v6.467l.907.523h2.322l1.857-1.904 4.166 4.166V24l.015-.014.014.014v-.028l2.51-2.509h.485c.111 0 .211-.07.25-.179l.146-.426c.028-.084.012-.172-.037-.239l1.462-1.462-.612 1.962c-.043.141.036.289.177.332.025.008.052.012.078.012h1.824c.106-.001.201-.064.243-.163l.165-.394c.025-.065.024-.138-.004-.203-.027-.065-.08-.116-.146-.142-.029-.012-.062-.019-.097-.02h-.075l.84-2.644h1.232l-1.016 3.221c-.043.141.036.289.176.332.025.008.052.012.079.012h2.002c.11 0 .207-.066.248-.17l.164-.428c.051-.138-.021-.29-.158-.341-.029-.011-.06-.017-.091-.017h-.145l1.131-3.673c.027-.082.012-.173-.039-.24l-.375-.504-.003-.005c-.051-.064-.127-.102-.209-.102h-1.436c-.071 0-.141.03-.19.081l-.4.439h-.624l-.042-.046 4.445-4.445H24L23.986 12l.014-.014zM9.838 21.139l1.579-4.509h-.501l.297-.304h1.659l-1.563 4.555h.623l-.079.258H9.838zm3.695-7.516l.15.151-.269.922-.225.226h-.969l-.181-.181.311-.871.288-.247h.895zM5.59 20.829H3.877l-.262-.15V3.091H2.379l-.1-.1V1.815l.143-.154h7.371l.213.214v1.108l-.142.173H8.785v8.688l8.807-8.688h-2.086l-.175-.188V1.805l.121-.111h7.49l.132.133v1.07L12.979 13.25h-.373c-.015-.001-.028 0-.042.001l-.02.003c-.045.01-.086.03-.119.06l-.343.295-.004.003c-.033.031-.059.069-.073.111l-.296.83-6.119 6.276zm14.768-3.952l.474-.519h1.334l.309.415-1.265 4.107h.493l-.08.209H19.84l1.124-3.564h-2.015l-1.077 3.391h.424l-.073.174h-1.605l1.107-3.548h-2.096l-1.062 3.339h.436l-.072.209H13.27l1.514-4.46H14.198l.091-.271h1.65l.519.537h.906l.491-.554h1.061l.489.535h.953z"/></svg></button>
            <button id="source-comment-btn" type="button" disabled title="Select source text to comment" aria-label="Select source text to comment"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg></button>
            <button id="source-page-btn" type="button" disabled title="Select source text to show it in the Preview (Ctrl+Alt+P, gs with Vim keys)" aria-label="Select source text to show it in the Preview (Ctrl+Alt+P, gs with Vim keys)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button id="source-reload-btn" type="button" disabled title="Reload the file from disk" aria-label="Reload the file from disk"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button id="source-save-btn" type="button" disabled title="Save (Ctrl+S)" aria-label="Save (Ctrl+S)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
          </div>
          <div id="source-editor"></div>
        </section>
      </div>

      <aside id="sidebar">
        <div id="sidebar-grip" class="sidebar-grip" role="separator" tabindex="0" aria-orientation="horizontal"
             aria-controls="workspace sidebar" aria-label="Resize the comments panel" title="Drag to resize"></div>
        <div class="sidebar-tabs">
          <button class="tab-btn" data-tab="pages" type="button">Pages</button>
          <button class="tab-btn active" data-tab="comments" type="button">Comments<span id="comments-tab-count" class="tab-count hidden"></span></button>
          <button class="tab-btn" data-tab="problems" type="button">Problems<span id="problems-count" class="tab-count hidden"></span></button>
        </div>

        <div id="tab-pages" class="tab-pane">
          <nav id="pages-list" aria-label="Artifact pages"></nav>
        </div>

        <div id="tab-problems" class="tab-pane">
          <div id="problems-list" class="problems-list"></div>
        </div>

        <!-- The comment panel draws itself here (shared/comment-panel.js). -->
        <div id="tab-comments" class="tab-pane active"></div>
      </aside>
    </main>
  </div>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h3>Settings</h3>
      <!-- Theme, text size and the key that sends a comment, filled in by shared/settings.js. -->
      <div id="settings-look"></div>
      <div class="dialog-actions">
        <button value="close" autofocus>Close</button>
      </div>
    </form>
  </dialog>

  <!-- Help, which shared/help.js draws with this page's parts. The comment keys on the Keys
       page are filled in from the keys themselves each time the dialog opens. The tests type
       the example on the Search page into the search box, so each step must find what its
       text says. -->
  <dialog id="help-dialog" aria-labelledby="help-title">
    <template data-slot="start">
        <h4>Add a comment</h4>
        <p>Select words on a page and choose <b>Comment</b>. In the Source, select text and
          press the comment <span class="help-nowrap">button <svg class="help-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg></span>
          in the editor's toolbar. For a figure or anything else without text to select, choose
          the box <span class="help-nowrap">tool <svg class="help-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6M8 12h8M12 8v8"/></svg></span>
          in the toolbar above the artifact and draw a box over it. To comment on a whole page,
          press <b>+ comment</b> beside it in the Pages tab, and to comment on the artifact as a
          whole, choose <b>Add a note on the whole artifact…</b> in the ⋯ menu.</p>
        <h4>Call the agent</h4>
        <p>Write as many comments as you like. When they are ready, press the
          <span class="help-nowrap">bell <svg class="help-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg></span>
          above the comment list, or <kbd>Ctrl+Alt+Enter</kbd>, and the agent receives them all at
          once. The bell is green while an agent is listening. When it is red, the call is queued
          until an agent connects.</p>
        <h4>Read the reply</h4>
        <p>The agent edits the artifact's HTML source, checks the layout of the pages it changed
          and replies in each comment's thread. When the wording is yours to decide, it proposes
          a change instead. The card shows the current lines marked − and the new ones marked +,
          and the Source highlights the same text in red. <b>Apply suggestion</b> writes the
          change into the file, and <b>Reject</b> discards it. To ask for something different,
          use <b>Reply</b> and call the agent again.</p>
        <p>A comment is unanswered when its last message is from the agent. Its card is marked
          <span class="cmt-unanswered">unanswered</span>, the <b>unanswered</b> view lists only
          those comments, and the number on the Comments tab counts them.</p>
        <h4>Finish a thread</h4>
        <p>When the change is what you wanted, press <b>Resolve</b> on the card. <b>Archive</b>
          sets a thread aside without resolving it, and you can still reply to it. After either
          one, a line above the list says what was done, and <b>Undo</b> on that line, or the
          <kbd>u</kbd> key, reverses it.</p>
    </template>
    <template data-slot="search-example">
        <h4>Example: an answer from last week</h4>
        <p>Suppose the agent answered a comment of yours about a chart's legend a few days ago,
          and you want to read its answer again. You remember that it came on
          November&nbsp;13. Type the following in the search box.</p>
        <ol class="help-steps">
          <li><code class="help-typed"><span>legend</span></code>
            <p>The list shows only the threads with the word legend in them, in any status.</p></li>
          <li><code class="help-typed"><span>legend</span> <span>from:agent</span></code>
            <p>Adding <code>from:agent</code> leaves only those the agent wrote in.</p></li>
          <li><code class="help-typed"><span>legend</span> <span>from:agent</span> <span>after:11-13</span> <span>before:11-14</span></code>
            <p><code>after:11-13</code> keeps the threads with a message written on or after
              November&nbsp;13, and <code>before:11-14</code> keeps those with a message written
              before November&nbsp;14. Only the comment you were looking for is left.</p></li>
        </ol>
    </template>
    <template data-slot="search-order">With <b>page order</b>, comments keep the order they were
          written in.</template>
    <template data-slot="search-rows">
            <tr><td><code>from:agent</code></td><td>have a message from the agent</td></tr>
            <tr><td><code>file:slides</code></td><td>are on a source file whose path contains “slides”</td></tr>
    </template>
    <template data-slot="search-writers">Use <code>from:me</code> for your own messages.</template>
    <template data-slot="search-words">the messages, the text a comment is on, the title of its page,
          its file name and proposed changes</template>
    <template data-slot="search-thread"><code>from:me after:11-12</code> also finds a thread you wrote in on
          November&nbsp;10 if the agent replied on November&nbsp;12</template>
    <template data-slot="keys">
          <h4>Artifact</h4>
          <span class="keys-of"><kbd>Ctrl+F</kbd></span><span>Find words in the artifact, from the artifact or its slide previews. In the find bar, Enter and Shift+Enter go to the next and previous match, and Escape closes it</span>
          <h5>Slide previews</h5>
          <span class="keys-of"><kbd>↓</kbd><kbd>→</kbd><kbd>PageDown</kbd></span><span>Next page</span>
          <span class="keys-of"><kbd>↑</kbd><kbd>←</kbd><kbd>PageUp</kbd></span><span>Previous page</span>
          <span class="keys-of"><kbd>Home</kbd><kbd>End</kbd></span><span>First and last page</span>
          <h5>Slide show</h5>
          <p>For slides, the full screen button in the top bar starts the slide show. These keys
            then move through the slides, and the comment keys rest until it ends.</p>
          <span class="keys-of"><kbd>→</kbd><kbd>n</kbd><kbd>Space</kbd></span><span>Next slide. Enter, ↓ and PageDown do the same.</span>
          <span class="keys-of"><kbd>←</kbd><kbd>p</kbd><kbd>Backspace</kbd></span><span>Previous slide. ↑ and PageUp do the same.</span>
          <span class="keys-of"><kbd>Home</kbd><kbd>End</kbd></span><span>First and last slide</span>
          <span class="keys-of"><kbd>Escape</kbd></span><span>End the slide show</span>
          <h4>Source editor</h4>
          <span class="keys-of"><kbd>Ctrl+S</kbd></span><span>Save the file</span>
          <span class="keys-of"><kbd>Ctrl+Alt+M</kbd></span><span>Comment on the selected text</span>
          <span class="keys-of"><kbd>Ctrl+Alt+P</kbd></span><span>Show the selected text on the page</span>
          <span class="keys-of"><kbd>Ctrl+Alt+K</kbd></span><span>Go to the comment at the cursor in the comment list. Press it again there to come back.</span>
          <span class="keys-of"><kbd>Ctrl+Alt+Enter</kbd></span><span>Call the agent</span>
          <h5>With Vim keys</h5>
          <p>To use Vim keys, turn them on with the Vim button in the editor's toolbar. These keys
            then work along with Vim's usual ones.</p>
          <span class="keys-of"><kbd>:w</kbd></span><span>Save the file</span>
          <span class="keys-of"><kbd>jj</kbd><kbd>Escape</kbd><kbd>Ctrl+[</kbd></span><span>Leave Insert mode. Type jj quickly.</span>
          <span class="keys-of"><kbd>gc</kbd></span><span>Comment on the text a motion or selection covers, as in gcc for the line or gcip for the paragraph</span>
          <span class="keys-of"><kbd>gs</kbd></span><span>Show the text a motion or selection covers on the page, as in gss for the line</span>
          <span class="keys-of"><kbd>K</kbd></span><span>Go to the comment at the cursor in the comment list</span>
          <p>Text you yank is also copied to the system clipboard.</p>
    </template>
  </dialog>
