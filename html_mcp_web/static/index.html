<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>html-web</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // The theme is set before the page is drawn, so a dark page does not flash light: the
    // reader's last choice, else the system's.
    try {
      document.documentElement.dataset.theme = localStorage.getItem("htmlMcpTheme")
        ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>html-web</h1>
      <div class="artifact-meta" aria-label="Current artifact">
        <span id="main-file" class="main-file">loading</span>
        <span id="artifact-status" class="artifact-status">connecting</span>
      </div>
      <nav class="view-tabs" aria-label="Workspace view">
        <button class="view-tab active" type="button" data-view="preview">Preview</button>
        <button class="view-tab" type="button" data-view="source">Source</button>
        <button class="view-tab" type="button" data-view="split">Split</button>
      </nav>
      <nav id="artifact-tabs" class="artifact-tabs" aria-label="Artifacts"></nav>
      <div class="topbar-actions">
        <button id="fullscreen-btn" type="button" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button>
        <span class="more">
          <button id="more-btn" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          <div id="more-menu" class="more-menu" role="menu" hidden>
            <button id="download-pdf-btn" class="download-btn" type="button" role="menuitem" data-label="Export PDF" title="Export the artifact as a PDF">Export PDF</button>
            <button id="download-pptx-btn" class="download-btn" type="button" role="menuitem" data-label="Export PPTX" title="Export the deck as an editable pptx">Export PPTX</button>
            <button id="artifact-comment-btn" type="button" role="menuitem">Add a note on the whole artifact…</button>
            <button id="theme-btn" type="button" role="menuitem" aria-pressed="false">Dark mode</button>
          </div>
        </span>
        <button id="sidebar-toggle-btn" type="button" title="Toggle comments (\)">⇥</button>
      </div>
    </header>

    <main class="layout view-preview">
      <div id="workspace">
        <div class="workspace-toolbar">
          <button id="thumbs-btn" type="button" title="Show or hide slide previews"
                  aria-label="Show or hide slide previews" aria-pressed="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <rect x="1.5" y="1.5" width="4.5" height="3.2" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <rect x="1.5" y="6.4" width="4.5" height="3.2" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <rect x="1.5" y="11.3" width="4.5" height="3.2" rx=".6" fill="none" stroke="currentColor" stroke-width="1.2"/>
              <rect x="7.8" y="1.5" width="6.7" height="13" rx=".8" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </button>
          <button id="area-btn" type="button" title="Draw a box on a page to comment on it"
                  aria-label="Draw a box on a page to comment on it" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
              <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6M8 12h8M12 8v8" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="zoom-reset-btn" class="zoom-reset hidden" type="button"
                  title="Back to the size the pane fits">Fit</button>
          <button id="scripts-btn" type="button" title="Show or hide speaker scripts" aria-label="Show or hide speaker scripts">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <path d="M2.5 1.5h8l3 3v10h-11z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M10.5 1.5v3h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M4.5 7.5h7M4.5 10h7M4.5 12.5h4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="search-btn" type="button" title="Find in the artifact (⌘F or Ctrl+F)"
                  aria-label="Find in the artifact" aria-controls="search-bar" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
              <circle cx="6.7" cy="6.7" r="4.7" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M10.2 10.2l4.3 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <section id="artifact-pane">
          <aside id="thumbs-pane" aria-label="Slide previews">
            <iframe id="thumbs-frame" title="Slide previews" tabindex="-1"></iframe>
          </aside>
          <iframe id="artifact-frame" class="artifact-frame active" title="Agent-generated HTML artifact" tabindex="-1"></iframe>
          <div id="search-bar" class="search-bar hidden" role="search">
            <input id="search-input" type="text" placeholder="Find in artifact" aria-label="Find in artifact"
                   autocomplete="off" spellcheck="false">
            <span id="search-count" class="search-count" aria-live="polite"></span>
            <button id="search-prev-btn" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)" disabled>↑</button>
            <button id="search-next-btn" type="button" aria-label="Next match" title="Next match (Enter)" disabled>↓</button>
            <button id="search-close-btn" type="button" aria-label="Close find" title="Close (Esc)">×</button>
          </div>
          <button id="selection-comment-btn" class="selection-comment hidden" type="button">Comment</button>
          <button id="selection-source-btn" class="selection-source hidden" type="button"
                  title="Show these words in the source">Source</button>
          <div id="presentation-controls" class="presentation-controls" aria-label="Slide show controls">
            <button id="presentation-prev-btn" type="button" aria-label="Previous slide">←</button>
            <span id="presentation-page" aria-live="polite"></span>
            <button id="presentation-next-btn" type="button" aria-label="Next slide">→</button>
            <button id="presentation-exit-btn" type="button">Exit</button>
          </div>
        </section>

        <div id="split-grip" role="separator" tabindex="0" aria-label="Resize preview and source panes"
             aria-controls="artifact-pane source-pane" aria-orientation="vertical"
             aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" title="Drag to resize preview and source"></div>
        <section id="source-pane" aria-label="Source editor">
          <div class="source-toolbar">
            <span id="source-file" class="source-file">Source</span>
            <span id="source-status" class="source-status">Open Source to edit</span>
            <button id="source-font-smaller-btn" type="button" title="Smaller source text" aria-label="Smaller source text"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 12h6"/></svg></button>
            <button id="source-font-larger-btn" type="button" title="Larger source text" aria-label="Larger source text"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 12h6M18 9v6"/></svg></button>
            <button id="source-wrap-btn" type="button" aria-pressed="true" title="Wrap long lines" aria-label="Wrap long lines"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h15a3 3 0 1 1 0 6h-4M3 18h7"/><path d="m16 16-2 2 2 2"/></svg></button>
            <button id="source-vim-btn" type="button" aria-pressed="false" title="Vim keys (:w saves)" aria-label="Vim keys (:w saves)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="currentColor"><path d="M24 11.986h-.027l-4.318-4.318 4.303-4.414V1.461l-.649-.648h-8.198l-.66.605v1.045L12.015.027V0L12 .014 11.986 0v.027l-1.29 1.291-.538-.539H2.035l-.638.692v1.885l.616.616h.72v5.31L.027 11.987H0L.014 12 0 12.014h.027l2.706 2.706v6.467l.907.523h2.322l1.857-1.904 4.166 4.166V24l.015-.014.014.014v-.028l2.51-2.509h.485c.111 0 .211-.07.25-.179l.146-.426c.028-.084.012-.172-.037-.239l1.462-1.462-.612 1.962c-.043.141.036.289.177.332.025.008.052.012.078.012h1.824c.106-.001.201-.064.243-.163l.165-.394c.025-.065.024-.138-.004-.203-.027-.065-.08-.116-.146-.142-.029-.012-.062-.019-.097-.02h-.075l.84-2.644h1.232l-1.016 3.221c-.043.141.036.289.176.332.025.008.052.012.079.012h2.002c.11 0 .207-.066.248-.17l.164-.428c.051-.138-.021-.29-.158-.341-.029-.011-.06-.017-.091-.017h-.145l1.131-3.673c.027-.082.012-.173-.039-.24l-.375-.504-.003-.005c-.051-.064-.127-.102-.209-.102h-1.436c-.071 0-.141.03-.19.081l-.4.439h-.624l-.042-.046 4.445-4.445H24L23.986 12l.014-.014zM9.838 21.139l1.579-4.509h-.501l.297-.304h1.659l-1.563 4.555h.623l-.079.258H9.838zm3.695-7.516l.15.151-.269.922-.225.226h-.969l-.181-.181.311-.871.288-.247h.895zM5.59 20.829H3.877l-.262-.15V3.091H2.379l-.1-.1V1.815l.143-.154h7.371l.213.214v1.108l-.142.173H8.785v8.688l8.807-8.688h-2.086l-.175-.188V1.805l.121-.111h7.49l.132.133v1.07L12.979 13.25h-.373c-.015-.001-.028 0-.042.001l-.02.003c-.045.01-.086.03-.119.06l-.343.295-.004.003c-.033.031-.059.069-.073.111l-.296.83-6.119 6.276zm14.768-3.952l.474-.519h1.334l.309.415-1.265 4.107h.493l-.08.209H19.84l1.124-3.564h-2.015l-1.077 3.391h.424l-.073.174h-1.605l1.107-3.548h-2.096l-1.062 3.339h.436l-.072.209H13.27l1.514-4.46H14.198l.091-.271h1.65l.519.537h.906l.491-.554h1.061l.489.535h.953z"/></svg></button>
            <button id="source-comment-btn" type="button" disabled title="Select source text to comment" aria-label="Select source text to comment"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/></svg></button>
            <button id="source-page-btn" type="button" disabled title="Select source text to show it in the Preview" aria-label="Select source text to show it in the Preview"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button id="source-reload-btn" type="button" disabled title="Reload the file from disk" aria-label="Reload the file from disk"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button id="source-save-btn" type="button" disabled title="Save (Ctrl+S)" aria-label="Save (Ctrl+S)"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
          </div>
          <div id="source-editor"></div>
        </section>
      </div>

      <aside id="sidebar">
        <div id="sidebar-grip" class="sidebar-grip" role="separator" tabindex="0" aria-orientation="horizontal"
             aria-controls="workspace sidebar" aria-label="Resize the comments panel" title="Drag to resize"></div>
        <div class="sidebar-tabs">
          <button class="tab-btn" data-tab="pages" type="button">Pages</button>
          <button class="tab-btn active" data-tab="comments" type="button">Comments<span id="open-count" class="tab-count hidden"></span></button>
          <button class="tab-btn" data-tab="problems" type="button">Problems<span id="problems-count" class="tab-count hidden"></span></button>
        </div>

        <div id="tab-pages" class="tab-pane">
          <nav id="pages-list" aria-label="Artifact pages"></nav>
        </div>

        <div id="tab-problems" class="tab-pane">
          <div id="problems-list" class="problems-list"></div>
        </div>

        <div id="tab-comments" class="tab-pane active">
          <div class="filter-row">
            <span class="pick"><span id="comment-filter-name" class="pick-name" aria-hidden="true">open</span><select id="comment-filter" aria-label="Comment status">
              <option value="open" selected>open</option>
              <option value="resolved">resolved</option>
              <option value="reference">archived</option>
              <option value="all">all</option>
            </select></span>
            <!-- Icons, with the words as title and aria-label: written out, the row ran out of
                 room on a phone and wrapped. Each button shows the one drawing that fits its
                 state; a count rides beside the drawing where the action has one. A button with
                 nothing to do is greyed out, not taken away: the row keeps one shape. -->
            <button id="fold-all-btn" class="icon-btn" type="button" aria-label="Expand all" title="Expand all">
              <svg class="icon-expand" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4-4 4 4M4 10l4 4 4-4"/></svg>
              <svg class="icon-collapse hidden" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2l4 4 4-4M4 14l4-4 4 4"/></svg>
            </button>
            <button id="pick-all-btn" class="icon-btn" type="button" aria-label="Select all" title="Select all">
              <svg class="icon-select" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 8.5l2 2 4-4"/></svg>
              <svg class="icon-clear hidden" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5 8h6"/></svg>
            </button>
            <button id="resolve-picked-btn" class="icon-btn" type="button" disabled aria-label="Resolve" title="Resolve the picked comments">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M5 8l2 2 4-4"/></svg><span class="count"></span>
            </button>
            <button id="archive-picked-btn" class="icon-btn" type="button" disabled aria-label="Archive" title="Archive the picked comments">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12v3H2z"/><path d="M3 6v7h10V6M6 9h4"/></svg><span class="count"></span>
            </button>
            <button id="reopen-picked-btn" class="icon-btn" type="button" disabled aria-label="Reopen" title="Reopen the picked comments">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5"/><path d="M13 3v3h-3"/></svg><span class="count"></span>
            </button>
            <button id="call-agent-btn" class="icon-btn agent-offline" type="button" aria-label="Queue call for agent" title="Agent is not waiting; queue this call until it reconnects (Ctrl+Alt+Enter)">
              <span id="agent-waiting-dot" class="agent-dot"></span>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg>
              <span id="call-agent-word" class="count"></span>
            </button>
          </div>
          <div id="comments-list" class="comments-list"></div>
        </div>
      </aside>
    </main>
  </div>

  <dialog id="compose-dialog">
    <form id="compose-form">
      <h3>New comment</h3>
      <blockquote id="compose-anchor"></blockquote>
      <textarea id="compose-text" rows="5" required
                placeholder="Leave feedback for the agent (shift+enter to post)"></textarea>
      <!-- The action that finishes the comment comes first, so Tab out of the text lands
           on it and Enter posts. -->
      <div class="dialog-actions">
        <button id="compose-submit" type="submit">Post</button>
        <button id="compose-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="/static/ace/ace.js?v=1.44.0"></script>
  <script type="module" src="/static/viewer.js"></script>
</body>
</html>
